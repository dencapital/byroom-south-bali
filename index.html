  const dest = S.trDest || V().dest;

  get title(){ return L("iHelp"); }, get kicker(){ return V().name; }, get sub(){ return L("helpSub"); }, img:"assets/svc/spa_still.webp",
  body(){ const v = V(); return h.sec("useful", L("iHelp"), "", `<div class="ilist">${L("useful").map(([k, t, m, href]) => {
      const u = href === "VMAP" ? v.map : href === "PHARM" ? "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent("pharmacy near " + v.address) : href;
      return `<a class="irow" href="${u}" ${u.startsWith("http") ? 'target="_blank" rel="noopener"' : ""}><span class="ic">${ic(k)}</span><span class="b"><span class="t">${esc(t)}</span><br><span class="m">${esc(m)}</span></span><span class="ch">${ic("chev")}</span></a>`; }).join("")}</div>`); }
};

/* ---------- home ---------- */
function renderHome(){
  const v = V();
  document.documentElement.lang = lang;
  $$("[data-i]").forEach(el => el.textContent = L(el.dataset.i));
  $$("[data-ih]").forEach(el => el.innerHTML = L(el.dataset.ih));
  Guide.langMenu($("#langs"), LANGS, lang, code => { lang = code; try { localStorage.setItem("sbLang2", lang); } catch(_){} renderHome(); Guide.repaint(); dyn(); });
  $("#heroSub").textContent = `${v.name} · ${tr(AREA[v.area])}`;
  $("#stayCard").innerHTML = `
    <div class="stay-h"><div class="stay-ph" style="background-image:url('${v.photo}')"></div>
      <div class="b"><div class="k">${esc(L("stayK"))}</div><div class="n">${esc(v.name)}</div><div class="a">${esc(v.address)}</div></div>
      <a class="iconbtn" href="${v.map}" target="_blank" rel="noopener" aria-label="${esc(L("openMaps"))}">${ic("pin")}</a></div>
    <div class="villas">${Object.entries(VILLAS).map(([k, x]) => `<button type="button" data-villa="${k}" class="${k === vKey ? "on" : ""}">${esc(x.name)}</button>`).join("")}</div>
    <div class="stay-g">
      <button type="button" data-view="stay"><span class="l">${ic("wifi")}Wi-Fi</span><span class="v">${esc(v.wifi || L("wifiBtn"))}</span><span class="s">${esc(L("wifiS"))}</span></button>
      <a href="${waV("help")}" target="_blank" rel="noopener"><span class="l">${ic("chat")}${esc(L("concierge"))}</span><span class="v">${esc(L("concHours"))}</span><span class="s">${esc(L("conciergeS"))}</span></a></div>`;
  const tiles = [
    ["move", "gMove", "gMoveS", "assets/svc/tour_temple.webp", 3, true],
    ["spa", "gSpa", "gSpaS", "assets/svc/spa_massage.webp", SPA.length],
    ["adv", "gAdv", "gAdvS", "assets/svc/adv_raft.webp", ADV.length + TRIPS.length + 1 + MORE_ADV.length],
    ["celebrate", "gCele", "gCeleS", "assets/svc/celebrate.jpg", CELEB.length],
    ["home", "gHome", "gHomeS", v.photo, 3]
  ];
  $("#bento").innerHTML = tiles.map(([id, t, s, img, n, big]) => `
    <button type="button" class="tile rv ${big === true ? "big" : big || ""}" data-view="${id}" style="background-image:url('${img}')"><span class="bg"></span>
      <span class="go">${ic("arrow")}</span><span class="in"><span class="c">${n} ${esc(L("services"))}</span><h3>${esc(L(t))}</h3><p>${esc(L(s))}</p></span></button>`).join("");
  $("#exK").textContent = L("exK"); $("#exH").innerHTML = `${esc(L("exH"))}<em>${esc(tr(AREA[v.area]))}</em>`;
  $("#rail").innerHTML = PLACES[v.area].map(([n, tag, d], i) => `
    <button type="button" class="pcard" data-view="explore"><div class="ph ${pimg(n) ? "" : "txt"}" ${pimg(n) ? `style="background-image:url('${pimg(n)}')"` : ""}><span class="tag">${esc(tr(tag))}</span>${pimg(n) ? "" : "0" + (i + 1)}</div><div class="b"><div class="t">${esc(n)}</div><div class="m">${esc(tr(d))}</div></div></button>`).join("");
  $("#infoList").innerHTML = [["wifi","iWifi","iWifiS","stay"],["home","iHk","iHkS","home"],["calendar","iExtend","iExtendS","home","extend"],["phone","iHelp","iHelpS","help"]]
    .map(([k, t, s, view, sub]) => `<button type="button" class="irow" data-view="${view}" ${sub ? `data-sub="${sub}"` : ""}><span class="ic">${ic(k)}</span><span class="b"><span class="t">${esc(L(t))}</span><br><span class="m">${esc(L(s))}</span></span><span class="ch">${ic("chev")}</span></button>`).join("");
  $("#teamList").innerHTML = L("team").map(([a, n, r, ph]) => `
    <a class="person" target="_blank" rel="noopener" href="${wa(ph, WA_EN.hi.replace("Brigita", n).replace("{v}", v.name))}"><div class="av">${a}</div><div class="b"><div class="n">${n}</div><div class="r">${esc(r)}</div></div><span class="pill-wa">${Kit.icon.wa.replace('width="20" height="20"', "")} WhatsApp</span></a>`).join("");
  $("#fbBad").href = waV("bad"); $("#fbGood").href = waV("good");
  Kit.relabel(); Guide.reveal();
}
function dyn(){
  $$(".k-step").forEach(w => Kit.setStep(w, +w.dataset.val));
  BIKES.forEach(b => { const el = document.querySelector(`[data-tot="${b.id}"]`); if (el) el.textContent = S.days > 1 ? `${unit(S.days, L("dayU"))} · ${fmt(b.price * S.days)}` : ""; });
  const sum = document.querySelector('[data-sum="transfer"]'); if (sum) sum.textContent = `${(L("trDir").find(d => d[0] === S.trDir) || [])[1]} · ${S.trDest || V().dest}`;
  Kit.updatePrices(); Kit.sync();
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const lb = e.target.closest("#langs button");
  const vb = e.target.closest("[data-villa]");
  if (vb){ vKey = vb.dataset.villa; S.trDest = null; try { localStorage.setItem("sbVilla", vKey); history.replaceState(null, "", "?villa=" + vKey + location.hash); } catch(_){} renderHome(); Kit.refreshAll(); return; }
  const row = e.target.closest(".rr.pick[data-dest]");
  if (row){ S.trDest = row.dataset.dest; Guide.repaint(); return; }
});
document.addEventListener("keydown", e => { const r = e.target.closest && e.target.closest(".rr.pick"); if (r && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); r.click(); } });
document.addEventListener("kpick", e => { const {group, value} = e.detail; if (group === "hkDay" || group === "hkTime") S[group] = +value; else S[group] = value; dyn(); });
document.addEventListener("kstep", e => { S[e.detail.name] = e.detail.value; dyn(); });
document.addEventListener("input", e => { if (/^tr/.test(e.target.id)) dyn(); });

/* ---------- boot ---------- */
Kit.init({ lang:() => lang, L:k => (T[lang] && T[lang][k]) || k, phone:GUEST, villa:() => V().name, chatHref:() => waV("help"), roomField:false });
Guide.setup({ L, afterRender:dyn });
Kit.mountDock();
renderHome();
Guide.mount();
Guide.hero($("#top"), { wide:{src:"assets/video/sb_wide.mp4", poster:"assets/video/sb_wide.jpg"}, mobile:{src:"assets/video/sb_m.mp4", poster:"assets/video/sb_m.jpg"} });
dyn();
</script>
</body>
</html>
